# 250 requests/day for the whole API - the reqres.in free plan limit
type: throttling policy
subtype: advanced policy
version: v4.7.0
data:
  policyName: ReqRes
  displayName: ReqRes
  description: "250 requests per day for the whole API - matches the reqres.in free plan limit (backend: CustomerProxy -> reqres.in)"
  type: AdvancedThrottlePolicy
  defaultLimit:
    type: REQUESTCOUNTLIMIT
    requestCount:
      timeUnit: day
      unitTime: 1
      requestCount: 250
  conditionalGroups: []

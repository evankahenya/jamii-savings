# APIM definition of CustomersAPI (apictl project format, APIM 4.7).
# The OpenAPI definition and the policies are NOT stored here - the pipeline copies them in
# when packaging (from src/main/wso2mi/resources/api-definitions/ and apim-policies/),
# so there is only one copy of each. Per-environment backend URLs are in params.yaml.
type: api
version: v4.7.0
data:
  name: CustomersAPI
  description: Customer record from the CRM (GET /{customerId}) and a customer dashboard with all account balances (GET /{customerId}/dashboard).
  context: /customers
  version: 1.0.0
  provider: admin
  lifeCycleStatus: PUBLISHED
  isRevision: false
  revisionId: 0
  type: HTTP
  transport:
  - http
  - https
  policies:
  - Unlimited
  - Gold
  - Silver
  - Bronze
  visibility: PUBLIC
  # API-level rate limit shared by ALL callers: the reqres.in backend allows only 250
  # requests/day. Custom policy defined in apim-throttling-policies/ReqRes.yaml
  apiThrottlingPolicy: ReqRes
  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://mi:8290/customers
    sandbox_endpoints:
      url: http://mi:8290/customers
  endpointImplementationType: ENDPOINT
  # Applied to every operation of the API
  apiPolicies:
    request: []
    response:
    - policyName: jamiiHeaderSecurityPolicies
      policyVersion: v1
      parameters: {}
    fault:
    - policyName: jamiiBackendErrorPolicy
      policyVersion: v1
      parameters: {}

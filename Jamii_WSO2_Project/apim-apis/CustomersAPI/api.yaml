type: api
version: v4.7.0
data:
  name: CustomersAPI
  description: Customer record from the CRM (GET /{customerId}) and a customer dashboard with all account balances (GET /{customerId}/dashboard).
  context: /customers
  version: 1.0.0
  provider: admin
  lifeCycleStatus: PUBLISHED
  isRevision: false
  revisionId: 0
  type: HTTP
  transport:
  - http
  - https
  policies:
  - Unlimited
  - Gold
  - Silver
  - Bronze
  visibility: PUBLIC
  # reqres.in only allows 250 requests a day
  apiThrottlingPolicy: ReqRes
  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://mi:8290/customers
    sandbox_endpoints:
      url: http://mi:8290/customers
  endpointImplementationType: ENDPOINT
  apiPolicies:
    request: []
    response:
    - policyName: jamiiHeaderSecurityPolicies
      policyVersion: v1
      parameters: {}
    fault:
    - policyName: jamiiBackendErrorPolicy
      policyVersion: v1
      parameters: {}

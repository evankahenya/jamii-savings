openapi: 3.0.1
info:
  title: AccountBalanceAPI
  description: >
    Returns the current balance of an account from the Jamii Savings database
    (AccountDataService). Repeat requests for the same account within 60
    seconds are served from cache.
  version: 1.0.0
servers:
  - url: http://localhost:8290/accounts
  - url: https://localhost:8253/accounts
paths:
  /{accountNumber}/balance:
    get:
      summary: Get account balance
      description: Returns the current balance of an account. Repeat requests for the same account within 60 seconds are served from cache.
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: 13-digit account number
          schema:
            type: string
          example: "0051012695378"
      responses:
        "200":
          description: Account balance
          headers:
            X-Cache-Status:
              description: MISS when fetched from the database, HIT when served from cache
              schema:
                type: string
                enum:
                  - MISS
                  - HIT
                example: MISS
            X-Cache-Age:
              description: Seconds since the cached response was fetched from the database (0 on MISS)
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
              examples:
                active:
                  summary: Active account
                  value:
                    accountNumber: "0051012695378"
                    status: ACTIVE
                    balance:
                      amount: 15250.75
                      currency: KES
                    requestId: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
                dormant:
                  summary: Dormant account
                  value:
                    accountNumber: "9876543210987"
                    status: DORMANT
                    balance:
                      amount: 0
                      currency: KES
                    requestId: 7a1d2e3f-4b5c-4d6e-8f90-a1b2c3d4e5f6
                    timestamp: "2026-10-12T09:16:02.456+03:00"
        "400":
          description: Account number is not exactly 13 digits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidAccountNumber:
                  summary: Account number is not 13 digits
                  value:
                    error: Invalid account number. Expected exactly 13 digits.
                    code: 400
                    requestId: b4c5d6e7-f809-4a1b-9c2d-3e4f5a6b7c8d
                    timestamp: "2026-10-12T09:17:11.789+03:00"
        "401":
          description: |
            No API key, or the API key is not valid. Send the key from the Developer Portal in the `ApiKey` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingKey:
                  summary: No API key sent
                  value:
                    error: Missing credentials. The request has no API key or access token.
                    code: 401
                    details: "Send the API key in the 'ApiKey' header (AccountBalanceAPI) or an OAuth2 access token in the 'Authorization: Bearer' header (other APIs). Get one in the Developer Portal under Applications. (gateway error 900902)"
                    requestId: 0d6c1f7e-2a4b-4c8d-9e1f-3a5b7c9d1e2f
                    timestamp: "2026-10-12T09:15:30.123+03:00"
                invalidKey:
                  summary: API key not valid or expired
                  value:
                    error: Invalid credentials. The API key or access token is not valid, or has expired.
                    code: 401
                    details: Generate a new API key or access token in the Developer Portal, from an application that is subscribed to this API. (gateway error 900901)
                    requestId: 0d6c1f7e-2a4b-4c8d-9e1f-3a5b7c9d1e2f
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "403":
          description: |
            The API key is valid, but it isn't linked to an application that is subscribed to this API. Fix it in the Developer Portal, then call again with the same key:
            - Key created on this API's page: open the API, go to API Keys and associate the key with a subscribed application.
            - Key created in an application: subscribe that application to AccountBalanceAPI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notLinkedToSubscribedApp:
                  summary: The key isn't associated with a subscribed application
                  value:
                    error: Forbidden. This API key or access token is not linked to an application that is subscribed to this API.
                    code: 403
                    details: "In the Developer Portal: if you created the key on this API's page, open the API, go to API Keys and associate the key with an application that is subscribed to this API. If you created the key or token in an application, subscribe that application to this API (API, then Subscriptions). Then call again with the same key or token. (gateway error 900908)"
                    requestId: 0d6c1f7e-2a4b-4c8d-9e1f-3a5b7c9d1e2f
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "404":
          description: No account with this number in the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotFoundError"
              examples:
                accountNotFound:
                  summary: Account does not exist
                  value:
                    error: Account not found
                    accountNumber: "1234567890000"
                    code: 404
                    requestId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                    timestamp: "2026-10-12T09:18:45.012+03:00"
        "500":
          description: The database query failed (AccountDataService returned an error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                databaseError:
                  summary: Database returned an error
                  value:
                    error: Internal server error. Database unavailable
                    code: 500
                    requestId: d9e8f7a6-b5c4-4d3e-9f2a-1b0c9d8e7f6a
                    timestamp: "2026-10-12T09:19:20.345+03:00"
        "503":
          description: The database did not respond within 5 seconds, or an unexpected error occurred while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                serviceUnavailable:
                  summary: Database unreachable or timed out
                  value:
                    error: Service unavailable
                    code: 503
                    requestId: e5f6a7b8-c9d0-4e1f-a2b3-c4d5e6f7a8b9
                    timestamp: "2026-10-12T09:20:05.678+03:00"
components:
  schemas:
    AccountBalance:
      type: object
      required:
        - accountNumber
        - status
        - balance
        - requestId
        - timestamp
      properties:
        accountNumber:
          type: string
          example: "0051012695378"
        status:
          type: string
          enum:
            - ACTIVE
            - DORMANT
            - CLOSED
          example: ACTIVE
        balance:
          $ref: "#/components/schemas/Money"
        requestId:
          type: string
          description: ID generated by this API for the request
          example: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
        timestamp:
          type: string
          format: date-time
          description: Time the request was received
          example: "2026-10-12T09:15:30.123+03:00"
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          example: 15250.75
        currency:
          type: string
          example: KES
    Error:
      type: object
      required:
        - error
        - code
        - requestId
        - timestamp
      properties:
        error:
          type: string
          example: Invalid account number. Expected exactly 13 digits.
        code:
          type: integer
          example: 400
        details:
          type: string
          description: What to do to fix the problem. Sent with 401 and 403 errors from the gateway.
          example: In the Developer Portal, associate the API key with an application that is subscribed to this API.
        requestId:
          type: string
          description: ID generated by this API for the request
          example: b4c5d6e7-f809-4a1b-9c2d-3e4f5a6b7c8d
        timestamp:
          type: string
          format: date-time
          example: "2026-10-12T09:17:11.789+03:00"
    AccountNotFoundError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - accountNumber
          properties:
            accountNumber:
              type: string
              example: "1234567890000"

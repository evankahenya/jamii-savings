openapi: 3.0.1
info:
  title: LoansAPI
  description: >
    Loans for Jamii Savings (one API, two resources).

    POST /loans/eligibility checks whether a customer is eligible for a loan.
    Accepts a JSON request, validates it against
    resources/schemas/LoansEligibilityRequest.json, converts it to SOAP and calls
    the CheckLoanEligibility service. The SOAP response is checked against
    resources/schemas/LoansEligibilityResponse.xsd and returned as JSON. The SOAP
    requestHeader (requestId, correlationId, requestTimestamp, sourceSystem) is
    filled in by the gateway.

    POST /loans/applications is the entry point for loan applications. Validates
    the request against resources/schemas/LoanApplicationRequest.json, wraps it in
    a LoanApplicationSubmitted event and publishes it to the ActiveMQ queue
    LoanApplicationsQueue. Answers 202 straight away - the eligibility check is
    done asynchronously by LoanApplicationConsumer (which calls
    /loans/eligibility) and the result is published to LoanDecisionsQueue. The
    applicationId in the response is the correlation ID, and is also the eventId
    of the queued event.
  version: 1.0.0
servers:
  - url: http://localhost:8290/loans
  - url: https://localhost:8253/loans
paths:
  /eligibility:
    post:
      summary: Check loan eligibility
      description: Returns the eligibility decision for the applicant and loan request.
      parameters:
        - name: X-Correlation-ID
          in: header
          required: false
          description: |
            **Leave empty when testing** or turn on CORS

            Optional caller correlation ID (8-64 chars of A-Z a-z 0-9 . _ - :). Generated if missing or malformed.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityRequest"
      responses:
        "200":
          description: Eligibility decision
          headers:
            X-Correlation-ID:
              schema:
                type: string
                example: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResponse"
              examples:
                eligible:
                  summary: Applicant is eligible
                  value:
                    status: ELIGIBLE
                    riskBand: LOW
                    requestedAmount:
                      amount: 150000
                      currency: KES
                    indicativeAmount:
                      amount: 150000
                      currency: KES
                    tenorMonths: 12
                    instalment:
                      amount: 14025.5
                      currency: KES
                    debtToIncomeRatio: 0.32
                    reasons: Income and repayment history meet the product requirements
                    nextSteps: Proceed to full loan application
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "400":
          description: Body is not valid JSON, or a required field is missing or has the wrong type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidFields:
                  summary: Field missing or wrong type
                  value:
                    error: Invalid request. One or more fields are missing or invalid
                    code: 400
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
                invalidJson:
                  summary: Body is not valid JSON
                  value:
                    error: Invalid request. Body is not valid JSON
                    code: 400
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "415":
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unsupportedMediaType:
                  summary: Request is not JSON
                  value:
                    error: Unsupported body type. Request must be application/json
                    code: 415
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "500":
          description: Unexpected internal error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internalError:
                  summary: Mediation error
                  value:
                    error: Internal server error
                    code: 500
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "502":
          description: The loan service returned a non-200 status (including SOAP faults), or its response failed the schema check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badGateway:
                  summary: Unexpected loan service response
                  value:
                    error: Bad gateway. Unexpected response from loan service
                    code: 502
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "503":
          description: The loan service could not be reached, or is temporarily suspended after repeated connection failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                serviceUnavailable:
                  summary: Loan service unreachable
                  value:
                    error: Service unavailable. Upstream service is unreachable
                    code: 503
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
        "504":
          description: The loan service did not respond within 10 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                gatewayTimeout:
                  summary: Loan service timed out
                  value:
                    error: Gateway timeout. Upstream service did not respond in time
                    code: 504
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: "2026-10-12T09:15:30.123+03:00"
  /applications:
    post:
      summary: Submit a loan application
      description: Queues the application for an eligibility check and returns its applicationId.
      parameters:
        - name: X-Correlation-ID
          in: header
          required: false
          description: |
            **Leave empty when testing** or turn on CORS

            Optional caller correlation ID (8-64 chars of A-Z a-z 0-9 . _ - :). Generated if missing or malformed.
            Becomes the applicationId.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationRequest"
      responses:
        "202":
          description: Application accepted and queued for an eligibility check
          headers:
            X-Correlation-ID:
              schema:
                type: string
                example: 78821580-948b-4c75-8257-e18bfedeab9e
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplicationAccepted"
        "400":
          description: Body is not valid JSON, or a required field is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidFields:
                  summary: Field missing or invalid
                  value:
                    error: Invalid request. One or more fields are missing or invalid
                    code: 400
                    details: object has missing required properties (['kraPin'])
                    requestId: 78821580-948b-4c75-8257-e18bfedeab9e
                    timestamp: "2026-10-13T17:33:48.717Z"
                invalidJson:
                  summary: Body is not valid JSON
                  value:
                    error: Invalid request. Body is not valid JSON
                    code: 400
                    requestId: 78821580-948b-4c75-8257-e18bfedeab9e
                    timestamp: "2026-10-13T17:33:48.717Z"
        "415":
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected internal error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The message broker is unavailable - nothing was queued, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                brokerDown:
                  summary: Could not queue the application
                  value:
                    error: Service unavailable. The application could not be queued, please try again
                    code: 503
                    requestId: 78821580-948b-4c75-8257-e18bfedeab9e
                    timestamp: "2026-10-13T17:33:48.717Z"
components:
  schemas:
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          example: 150000
        currency:
          type: string
          example: KES
    EligibilityRequest:
      type: object
      required:
        - channelId
        - applicant
        - employmentDetails
        - loanRequest
        - consentToCreditAssessment
      properties:
        channelId:
          type: string
          example: MOBILE
        applicant:
          type: object
          required:
            - customerReference
            - firstName
            - lastName
            - nationalIdLastFour
            - kraPin
            - dateOfBirth
            - mobileNumber
            - county
            - residencyStatus
          properties:
            customerReference:
              type: string
              example: CUST-000123
            firstName:
              type: string
              example: Felix
            lastName:
              type: string
              example: Onyango
            nationalIdLastFour:
              type: string
              example: "8945"
            kraPin:
              type: string
              example: A212345678X
            dateOfBirth:
              type: string
              format: date
              example: "1989-01-09"
            mobileNumber:
              type: string
              example: "+254732345641"
            emailAddress:
              type: string
              description: Optional. Sent to the backend as an empty element when omitted.
              example: felix.onyango@example.com
            county:
              type: string
              example: Nairobi
            residencyStatus:
              type: string
              enum:
                - RESIDENT
                - NON_RESIDENT
              example: RESIDENT
        employmentDetails:
          type: object
          required:
            - employmentType
            - employerOrBusinessName
            - monthsWithEmployerOrBusiness
            - monthlyGrossIncome
            - monthlyNetIncome
            - incomeVerified
          properties:
            employmentType:
              type: string
              enum:
                - SALARIED
                - SELF_EMPLOYED
                - CASUAL
                - UNEMPLOYED
              example: SALARIED
            employerOrBusinessName:
              type: string
              example: Acme Ltd
            monthsWithEmployerOrBusiness:
              type: integer
              example: 36
            monthlyGrossIncome:
              $ref: "#/components/schemas/Money"
            monthlyNetIncome:
              $ref: "#/components/schemas/Money"
            otherMonthlyIncome:
              $ref: "#/components/schemas/Money"
            incomeVerified:
              type: boolean
              example: true
        loanRequest:
          type: object
          required:
            - productCode
            - requestedAmount
            - requestedTenorMonths
            - purpose
            - repaymentMethod
            - existingObligations
          properties:
            productCode:
              type: string
              example: PL-STD-12
            requestedAmount:
              $ref: "#/components/schemas/Money"
            requestedTenorMonths:
              type: integer
              example: 12
            purpose:
              type: string
              example: School fees
            repaymentMethod:
              type: string
              enum:
                - MPESA
                - BANK_TRANSFER
                - CHECK_OFF
                - STANDING_ORDER
              example: MPESA
            existingObligations:
              type: object
              required:
                - monthlyLoanRepayments
                - monthlyMobileLoanRepayments
                - monthlyOtherDebtPayments
                - hasOverdueFacility
                - daysPastDue
              properties:
                monthlyLoanRepayments:
                  $ref: "#/components/schemas/Money"
                monthlyMobileLoanRepayments:
                  $ref: "#/components/schemas/Money"
                monthlyOtherDebtPayments:
                  $ref: "#/components/schemas/Money"
                hasOverdueFacility:
                  type: boolean
                  example: false
                daysPastDue:
                  type: integer
                  example: 0
        consentToCreditAssessment:
          type: boolean
          description: Customer's consent to the credit assessment (Kenya DPA 2019).
          example: true
    EligibilityResponse:
      type: object
      properties:
        status:
          type: string
          example: ELIGIBLE
        riskBand:
          type: string
          example: LOW
        requestedAmount:
          $ref: "#/components/schemas/Money"
        indicativeAmount:
          $ref: "#/components/schemas/Money"
        tenorMonths:
          type: integer
          example: 12
        instalment:
          $ref: "#/components/schemas/Money"
        debtToIncomeRatio:
          type: number
          example: 0.32
        reasons:
          type: string
          example: Income and repayment history meet the product requirements
        nextSteps:
          type: string
          example: Proceed to full loan application
        requestId:
          type: string
          description: Correlation ID of the request (also sent in the X-Correlation-ID header)
          example: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
        timestamp:
          type: string
          format: date-time
          example: "2026-10-12T09:15:30.123+03:00"
    LoanApplicationRequest:
      type: object
      required:
        - customer
        - employment
        - loan
      properties:
        customer:
          type: object
          required: [reference, firstName, lastName, nationalIdLastFour, kraPin, dateOfBirth, mobileNumber, county]
          properties:
            reference:
              type: string
              example: CIF000123
            firstName:
              type: string
              example: Jane
            lastName:
              type: string
              example: Wanjiku
            nationalIdLastFour:
              type: string
              pattern: "^[0-9]{4}$"
              example: "5678"
            kraPin:
              type: string
              example: A012345678Z
            dateOfBirth:
              type: string
              format: date
              example: "1990-05-14"
            mobileNumber:
              type: string
              example: "+254712345678"
            county:
              type: string
              example: Nairobi
        employment:
          type: object
          required: [type, employer, monthsEmployed, grossIncome, netIncome]
          properties:
            type:
              type: string
              enum: [SALARIED, SELF_EMPLOYED, CASUAL, UNEMPLOYED]
              example: SALARIED
            employer:
              type: string
              example: Acme Ltd
            monthsEmployed:
              type: integer
              minimum: 0
              example: 36
            grossIncome:
              type: number
              minimum: 0
              example: 120000
            netIncome:
              type: number
              minimum: 0
              example: 95000
        loan:
          type: object
          required: [productCode, amount, tenorMonths, purpose, repaymentMethod, existingMonthlyDebt]
          properties:
            productCode:
              type: string
              example: PERSONAL
            amount:
              type: number
              minimum: 1
              description: Amount in KES
              example: 50000
            tenorMonths:
              type: integer
              minimum: 1
              example: 12
            purpose:
              type: string
              example: School fees
            repaymentMethod:
              type: string
              enum: [MPESA, BANK_TRANSFER, CHECK_OFF, STANDING_ORDER]
              example: MPESA
            existingMonthlyDebt:
              type: number
              minimum: 0
              description: Monthly repayments on existing loans, in KES
              example: 5000
    LoanApplicationAccepted:
      type: object
      properties:
        applicationId:
          type: string
          example: 78821580-948b-4c75-8257-e18bfedeab9e
        status:
          type: string
          enum: [RECEIVED]
        message:
          type: string
          example: Loan application received. Eligibility will be checked shortly.
        timestamp:
          type: string
          format: date-time
          example: "2026-10-13T17:33:48.585Z"
    Error:
      type: object
      required:
        - error
        - code
        - requestId
        - timestamp
      properties:
        error:
          type: string
          example: Invalid request. One or more fields are missing or invalid
        code:
          type: integer
          example: 400
        details:
          type: string
          description: Extra detail about a validation error (only on some 400 responses)
          example: "object has missing required properties (['kraPin'])"
        requestId:
          type: string
          description: Correlation ID of the request (also sent in the X-Correlation-ID header)
          example: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
        timestamp:
          type: string
          format: date-time
          example: "2026-10-12T09:15:30.123+03:00"

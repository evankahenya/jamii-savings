openapi: 3.0.1
info:
  title: JamiiProducts
  version: 1.0.0
servers:
 -
  url: /
security:
 -
  default: []
paths:
  /{accountNumber}/balance:
    get:
      summary: Get account balance
      description: Returns the current balance of an account. Repeat requests for the same account within 60 seconds are served from cache.
      parameters:
       -
        name: accountNumber
        in: path
        description: 13-digit account number
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: "0051012695378"
      responses:
        "200":
          description: Account balance
          headers:
            X-Cache-Status:
              description: "MISS when fetched from the database, HIT when served from cache"
              style: simple
              explode: false
              schema:
                type: string
                example: MISS
                enum:
                 - MISS
                 - HIT
            X-Cache-Age:
              description: Seconds since the cached response was fetched from the database (0 on MISS)
              style: simple
              explode: false
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
              examples:
                active:
                  summary: Active account
                  value:
                    accountNumber: "0051012695378"
                    status: ACTIVE
                    balance:
                      amount: 15250.75
                      currency: KES
                    requestId: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
                    timestamp: 2026-10-12T09:15:30.123+03:00
                dormant:
                  summary: Dormant account
                  value:
                    accountNumber: "9876543210987"
                    status: DORMANT
                    balance:
                      amount: 0
                      currency: KES
                    requestId: 7a1d2e3f-4b5c-4d6e-8f90-a1b2c3d4e5f6
                    timestamp: 2026-10-12T09:16:02.456+03:00
        "400":
          description: Account number is not exactly 13 digits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidAccountNumber:
                  summary: Account number is not 13 digits
                  value:
                    error: Invalid account number. Expected exactly 13 digits.
                    code: 400
                    requestId: b4c5d6e7-f809-4a1b-9c2d-3e4f5a6b7c8d
                    timestamp: 2026-10-12T09:17:11.789+03:00
        "404":
          description: No account with this number in the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotFoundError"
              examples:
                accountNotFound:
                  summary: Account does not exist
                  value:
                    error: Account not found
                    accountNumber: "1234567890000"
                    code: 404
                    requestId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                    timestamp: 2026-10-12T09:18:45.012+03:00
        "500":
          description: The database query failed (AccountDataService returned an error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                databaseError:
                  summary: Database returned an error
                  value:
                    error: Internal server error. Database unavailable
                    code: 500
                    requestId: d9e8f7a6-b5c4-4d3e-9f2a-1b0c9d8e7f6a
                    timestamp: 2026-10-12T09:19:20.345+03:00
        "503":
          description: "The database did not respond within 5 seconds, or an unexpected error occurred while processing the request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                serviceUnavailable:
                  summary: Database unreachable or timed out
                  value:
                    error: Service unavailable
                    code: 503
                    requestId: e5f6a7b8-c9d0-4e1f-a2b3-c4d5e6f7a8b9
                    timestamp: 2026-10-12T09:20:05.678+03:00
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /{customerId}:
    get:
      summary: Get customer by ID
      description: Returns the customer record for the given customer ID.
      parameters:
       -
        name: customerId
        in: path
        description: Customer record UUID
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: e46f08a1-2750-46c6-a2eb-21e1b11fe57a
       -
        name: X-Correlation-ID
        in: header
        description: |
          **Leave empty when testing** or turn on CORS

          Optional caller correlation ID (8-64 chars of A-Z a-z 0-9 . _ - :). Generated if missing or malformed.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Customer record (backend payload returned as is)
          headers:
            X-Correlation-ID:
              style: simple
              explode: false
              schema:
                type: string
                example: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRecord"
              examples:
                customer:
                  summary: Customer found
                  value:
                    data:
                      id: e46f08a1-2750-46c6-a2eb-21e1b11fe57a
                      collection_id: 872ef233-86b1-4415-8a1e-47f1d3e84696
                      project_id: 53942
                      app_user_id: null
                      created_by: 147235
                      created_at: 2026-10-11T17:02:14.913Z
                      updated_at: 2026-10-11T17:02:14.913Z
                      deleted_at: null
                      data:
                        name: Felix Omondi Onyango
                        email: felix.onyango@example.com
                        phone: "+254732345641"
                        address:
                          city: Nairobi
                          county: Nairobi
                          street: Mombasa Road
                          country: Kenya
                          postal_code: "00506"
                        kra_pin: A212345678X
                        lastname: Onyango
                        firstname: Felix
                        date_of_birth: 1989-01-09
                        account_number:
                         - "0051012695378"
                        identification_number: "31278945"
                        identification_document: ID
        "400":
          description: customerId is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidCustomerId:
                  summary: customerId is not a UUID
                  value:
                    error: Invalid customerId. Expected a UUID.
                    code: 400
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: 2026-10-12T09:15:30.123+03:00
        "404":
          description: No customer with this ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerNotFoundError"
              examples:
                customerNotFound:
                  summary: Customer does not exist
                  value:
                    error: Customer not found
                    customerId: 00000000-0000-4000-8000-000000000000
                    code: 404
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: 2026-10-12T09:15:30.123+03:00
        "500":
          description: Unexpected internal error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internalError:
                  summary: Mediation error
                  value:
                    error: Internal server error
                    code: 500
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: 2026-10-12T09:15:30.123+03:00
        "502":
          description: The customer records backend returned an unexpected status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badGateway:
                  summary: Unexpected backend status
                  value:
                    error: Bad gateway. Unexpected response from upstream service
                    code: 502
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: 2026-10-12T09:15:30.123+03:00
        "503":
          description: "The customer records backend could not be reached, or is temporarily suspended after repeated connection failures"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                serviceUnavailable:
                  summary: Backend unreachable
                  value:
                    error: Service unavailable. Upstream service is unreachable
                    code: 503
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: 2026-10-12T09:15:30.123+03:00
        "504":
          description: The customer records backend did not respond within 10 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                gatewayTimeout:
                  summary: Backend timed out
                  value:
                    error: Gateway timeout. Upstream service did not respond in time
                    code: 504
                    requestId: 9f1c2b7e-3a4d-4b8e-9c21-5d7e8f9a0b1c
                    timestamp: 2026-10-12T09:15:30.123+03:00
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: ReqRes
  /{customerId}/dashboard:

# placeholder

[server]
hostname = "localhost"
hot_deployment = true

[user_store]
type = "read_only_ldap"

[keystore.primary]
file_name = "repository/resources/security/wso2carbon.jks"
password = "wso2carbon"     # secret-detector:ignore
alias = "wso2carbon"
key_password = "wso2carbon"     # secret-detector:ignore

[truststore]
file_name = "repository/resources/security/client-truststore.jks"
password = "wso2carbon"     # secret-detector:ignore
alias = "symmetric.key.value"
algorithm = "AES"

# DB file from the sqlite-init volume
[[datasource]]
id = "JamiiDB"
url = "jdbc:sqlite:/home/wso2carbon/jamii-data/Jamii_db"
driver = "org.sqlite.JDBC"
pool_options.maxActive = 10
pool_options.testOnBorrow = true
pool_options.validationQuery = "SELECT 1"

# ActiveMQ container
[transport.jms]
sender_enable = true
listener_enable = true

[[transport.jms.sender]]
name = "myQueueSender"
parameter.initial_naming_factory = "org.apache.activemq.jndi.ActiveMQInitialContextFactory"
parameter.provider_url = "tcp://activemq:61616"
parameter.connection_factory_name = "QueueConnectionFactory"
parameter.connection_factory_type = "queue"
parameter.cache_level = "producer"
parameter.username = "$env{ACTIVEMQ_CONNECTION_USER}"
parameter.password = "$env{ACTIVEMQ_CONNECTION_PASSWORD}"

[[transport.jms.listener]]
name = "myQueueListener"
parameter.initial_naming_factory = "org.apache.activemq.jndi.ActiveMQInitialContextFactory"
parameter.provider_url = "tcp://activemq:61616"
parameter.connection_factory_name = "QueueConnectionFactory"
parameter.connection_factory_type = "queue"
parameter.cache_level = "consumer"
parameter.username = "$env{ACTIVEMQ_CONNECTION_USER}"
parameter.password = "$env{ACTIVEMQ_CONNECTION_PASSWORD}"

# Log masking (needs %mm in log4j2.properties)
[masking_pattern.properties]
"ACCOUNT_NUMBER_PATH" = '(?<=/accounts/)[^/ ?"}]+?(?=[^/ ?"}]{4}(?:[/ ?"}]|$))'
"CUSTOMER_ID_PATH" = '(?<=/customers/(?:records/)?)(?!records/)[^/ ?"}]+?(?=[^/ ?"}]{4}(?:[/ ?"}]|$))'
"CUSTOMER_PROXY_PATH" = '(?<=/services/CustomerProxy/)[^/ ?"}]+?(?=[^/ ?"}]{4}(?:[/ ?"}]|$))'
"ACCOUNT_NUMBER_FIELD" = '(?<=accountNumber[=": ]{1,4})[0-9]{9}(?=[0-9]{4}(?![0-9]))'

# don't pass the backend Server header to clients
[passthru_properties]
'http.server.preserve' = false

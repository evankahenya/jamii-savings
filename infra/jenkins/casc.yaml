jenkins:
  systemMessage: "Jamii CI"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8081/}"

# ids are referenced from ci/environments/<env>.properties
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "apim-dev-admin"
              description: "API Manager (dev) admin"
              username: "${APIM_DEV_USER:-admin}"
              password: "${APIM_DEV_PASSWORD:-admin}"
          - usernamePassword:
              scope: GLOBAL
              id: "mi-dev-admin"
              description: "Micro Integrator (dev) management API"
              username: "${MI_DEV_USER:-admin}"
              password: "${MI_DEV_PASSWORD:-admin}"

jobs:
  - script: |
      pipelineJob('jamii-api-deploy') {
        description('Builds and deploys the Jamii APIs to MI and API Manager')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${JAMII_GIT_URL:-file:///repo}') }
                branch('${JAMII_GIT_BRANCH:-*/main}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }

# Defaults are for dev. For uat/prod: docker compose --env-file env/uat.env up -d
name: ${COMPOSE_PROJECT_NAME:-jamii-dev}

services:

  # builds Jamii_db from schema.sql + seed.sql
  sqlite-init:
    image: ${SQLITE_IMAGE:-keinos/sqlite3:3.46.1}
    user: root
    entrypoint: ["/bin/sh", "/init-db.sh"]
    environment:
      RESET_DB: ${RESET_DB:-false}
    volumes:
      - jamii-data:/data
      - ../schema.sql:/sql/schema.sql:ro
      - ../seed.sql:/sql/seed.sql:ro
      - ./sqlite/init-db.sh:/init-db.sh:ro
    restart: "no"

  # builds the .car into MI's carbonapps volume (skipped if one is already there)
  car-build:
    image: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
    user: root
    entrypoint: ["/bin/sh", "/build-car.sh"]
    environment:
      FORCE_CAR_BUILD: ${FORCE_CAR_BUILD:-false}
    volumes:
      - ../Jamii_WSO2_Project:/src:ro
      - maven-repo:/root/.m2
      - mi-carbonapps:/carbonapps
      - ./mi/build-car.sh:/build-car.sh:ro
    restart: "no"

  activemq:
    image: ${ACTIVEMQ_IMAGE:-apache/activemq-classic:5.18.7}
    hostname: activemq
    environment:
      ACTIVEMQ_CONNECTION_USER: ${AMQ_USER:-admin}
      ACTIVEMQ_CONNECTION_PASSWORD: ${AMQ_PASSWORD:-admin}
      ACTIVEMQ_OPTS: "${AMQ_JAVA_MEMORY:--Xms64m -Xmx384m} -Djetty.host=0.0.0.0"
    command: ["activemq", "console", "xbean:file:/opt/apache-activemq/conf/jamii-activemq.xml"]
    ports:
      - "${AMQ_PORT_OPENWIRE:-61616}:61616"
      - "${AMQ_PORT_CONSOLE:-8161}:8161"
    volumes:
      - amq-data:/opt/apache-activemq/data
      - ./activemq/jamii-activemq.xml:/opt/apache-activemq/conf/jamii-activemq.xml:ro
    mem_limit: ${AMQ_MEM_LIMIT:-600m}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/61616'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mi:
    build:
      context: ./mi
      args:
        MI_BASE_IMAGE: ${MI_BASE_IMAGE:-wso2/wso2mi:4.6.0}
        ACTIVEMQ_IMAGE: ${ACTIVEMQ_IMAGE:-apache/activemq-classic:5.18.7}
    image: jamii-mi-runtime:4.6.0
    pull_policy: build
    hostname: mi
    environment:
      JAVA_OPTS: ${MI_JAVA_OPTS:--Xms256m -Xmx768m}
      ACTIVEMQ_CONNECTION_USER: ${AMQ_USER:-admin}
      ACTIVEMQ_CONNECTION_PASSWORD: ${AMQ_PASSWORD:-admin}
      reqres_api_key: ${REQRES_API_KEY:-pub_f02d3c4c984d392f88ffc537c5a37621}
      loans_eligibility_url: ${LOANS_ELIGIBILITY_URL:-http://localhost:8290/loans/eligibility}
      loan_max_retries: ${LOAN_MAX_RETRIES:-3}
      loan_retry_ttl_ms: ${LOAN_RETRY_TTL_MS:-60000}
    ports:
      - "${MI_PORT_HTTP:-8290}:8290"
      - "${MI_PORT_HTTPS:-8253}:8253"
      - "${MI_PORT_MGMT:-9164}:9164"
    volumes:
      - ./config/${ENV_NAME:-dev}/mi/deployment.toml:/home/wso2carbon/wso2mi-4.6.0/conf/deployment.toml:ro
      - ../Jamii_WSO2_Project/deployment/docker/resources/log4j2.properties:/home/wso2carbon/wso2mi-4.6.0/conf/log4j2.properties:ro
      - mi-carbonapps:/home/wso2carbon/wso2mi-4.6.0/repository/deployment/server/carbonapps
      - jamii-data:/home/wso2carbon/jamii-data
    mem_limit: ${MI_MEM_LIMIT:-1200m}
    depends_on:
      sqlite-init:
        condition: service_completed_successfully
      car-build:
        condition: service_completed_successfully
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9201/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  # the APIM image has no solr/ folder, so make the index volume writable for APIM's user
  apim-init:
    image: ${SQLITE_IMAGE:-keinos/sqlite3:3.46.1}
    user: root
    entrypoint: ["/bin/sh", "-c", "chown -R 10001:10001 /solr && echo '[apim-init] search index volume ready'"]
    volumes:
      - apim-solr:/solr
    restart: "no"

  apim:
    image: ${APIM_IMAGE:-registry.wso2.com/wso2-apim/am:4.7.0-rocky}
    hostname: apim
    depends_on:
      apim-init:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: ${APIM_JAVA_OPTS:--Xms512m -Xmx1536m}
    # APIM_ENCRYPTION_KEY for the $env{} placeholder in the APIM deployment.toml
    env_file:
      - path: ./env/${ENV_NAME:-dev}.secrets.env
        required: false
    ports:
      - "${APIM_PORT_CONSOLE:-9443}:9443"
      - "${APIM_PORT_GW_HTTP:-8280}:8280"
      - "${APIM_PORT_GW_HTTPS:-8243}:8243"
    volumes:
      - apim-db:/home/wso2carbon/wso2am-4.7.0/repository/database
      # keep the search index with the DB, or APIs disappear from the portals after a recreate
      - apim-solr:/home/wso2carbon/wso2am-4.7.0/solr
      - ./apim/_auth_failure_handler_.xml:/home/wso2carbon/wso2am-4.7.0/repository/deployment/server/synapse-configs/default/sequences/_auth_failure_handler_.xml:ro
      # files here mirror wso2am-4.7.0/ and are copied over it at startup by the image's entrypoint
      - ./config/${ENV_NAME:-dev}/apim:/home/wso2carbon/wso2-config-volume:ro
    mem_limit: ${APIM_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:9443/services/Version || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 15
    restart: unless-stopped

  # ---- Observability (profile "observability", on in dev via COMPOSE_PROFILES) ----
  # Lean ELK: no Logstash; masking runs in the jamii-logs Elasticsearch ingest pipeline.
  # Security is off, so ports are bound to localhost only - dev use only.

  elasticsearch:
    image: ${ELASTIC_IMAGE:-elasticsearch:9.5.5}
    profiles: [observability]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # the traces-apm@custom masking script runs several regexes over long label values
      script.painless.regex.enabled: "true"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: ${ES_MEM_LIMIT:-1300m}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  kibana:
    image: ${KIBANA_IMAGE:-kibana:9.5.5}
    profiles: [observability]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: ${KIBANA_NODE_OPTIONS:---max-old-space-size=1024}
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    mem_limit: ${KIBANA_MEM_LIMIT:-1300m}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 20
    restart: unless-stopped

  # receives OpenTelemetry traces (OTLP gRPC/HTTP on 8200) from APIM and MI
  apm-server:
    image: ${APM_SERVER_IMAGE:-elastic/apm-server:9.5.5}
    profiles: [observability]
    command: >
      -e
        -E apm-server.host=0.0.0.0:8200
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
    mem_limit: ${APM_MEM_LIMIT:-256m}
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # loads the masking pipeline and Kibana data views, then exits
  elk-init:
    image: ${ELASTIC_IMAGE:-elasticsearch:9.5.5}
    profiles: [observability]
    entrypoint: ["/bin/sh", "/observability/elk-init.sh"]
    volumes:
      - ./observability:/observability:ro
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"

  filebeat:
    image: ${FILEBEAT_IMAGE:-elastic/filebeat:9.5.5}
    profiles: [observability]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      JAMII_PROJECT: ${COMPOSE_PROJECT_NAME:-jamii-dev}
    volumes:
      - ./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    mem_limit: ${FILEBEAT_MEM_LIMIT:-200m}
    depends_on:
      elk-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  jamii-data:
  mi-carbonapps:
  maven-repo:
  amq-data:
  apim-db:
  apim-solr:
  es-data:
  filebeat-data:

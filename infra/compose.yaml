# =====================================================================
# Jamii Savings platform - ONE compose file for ALL environments.
#
# Works out of the box (run from this folder) - starts DEV:
#   docker compose up -d
#
# Other environments override the dev defaults with an env file:
#   docker compose --env-file env/uat.env  up -d     <- placeholder
#   docker compose --env-file env/prod.env up -d     <- placeholder
#
# Every ${VAR:-value} below shows the DEV default. Each environment gets its
# own project name (jamii-dev, jamii-uat, ...) so containers, networks and
# volumes of different environments never mix.
#
# Optional secrets: copy .env.example to .env (git-ignored). Compose reads
# .env automatically when no --env-file is given.
# =====================================================================
name: ${COMPOSE_PROJECT_NAME:-jamii-dev}

services:

  # -------------------------------------------------------------------
  # SQLite is just a FILE, not a server. This one-shot job builds the
  # Jamii_db file from schema.sql + seed.sql into a shared volume, then
  # exits. MI reads that same volume.
  # -------------------------------------------------------------------
  sqlite-init:
    image: ${SQLITE_IMAGE:-keinos/sqlite3:3.46.1}
    user: root
    entrypoint: ["/bin/sh", "/init-db.sh"]
    environment:
      RESET_DB: ${RESET_DB:-false}
    volumes:
      - jamii-data:/data
      - ../schema.sql:/sql/schema.sql:ro
      - ../seed.sql:/sql/seed.sql:ro
      - ./sqlite/init-db.sh:/init-db.sh:ro
    restart: "no"

  # -------------------------------------------------------------------
  # One-shot job: builds Jamii_WSO2_Project into a .car (Maven runs in
  # this container - nothing to install) and drops it into MI's
  # carbonapps volume. Skipped if a .car is already deployed (e.g. by
  # Jenkins). Force a rebuild:  FORCE_CAR_BUILD=true docker compose up -d
  # -------------------------------------------------------------------
  car-build:
    image: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
    user: root
    entrypoint: ["/bin/sh", "/build-car.sh"]
    environment:
      FORCE_CAR_BUILD: ${FORCE_CAR_BUILD:-false}
    volumes:
      - ../Jamii_WSO2_Project:/src:ro
      - maven-repo:/root/.m2
      - mi-carbonapps:/carbonapps
      - ./mi/build-car.sh:/build-car.sh:ro
    restart: "no"

  # -------------------------------------------------------------------
  # ActiveMQ Classic 5.18 - JMS broker for MI
  #   OpenWire (MI connects here): tcp://activemq:61616 (inside docker)
  #   Web console:  http://localhost:8161/admin   (admin / admin)
  # -------------------------------------------------------------------
  activemq:
    image: ${ACTIVEMQ_IMAGE:-apache/activemq-classic:5.18.7}
    hostname: activemq
    environment:
      # broker login (MI's JMS transport uses the same values)
      ACTIVEMQ_CONNECTION_USER: ${AMQ_USER:-admin}
      ACTIVEMQ_CONNECTION_PASSWORD: ${AMQ_PASSWORD:-admin}
      # the image's own ACTIVEMQ_OPTS keeps the console reachable; we add the heap size
      ACTIVEMQ_OPTS: "${AMQ_JAVA_MEMORY:--Xms64m -Xmx384m} -Djetty.host=0.0.0.0"
    # start with our config (default config + the loan-application retry rule).
    # See activemq/jamii-activemq.xml for why it isn't mounted over activemq.xml
    command: ["activemq", "console", "xbean:file:/opt/apache-activemq/conf/jamii-activemq.xml"]
    ports:
      - "${AMQ_PORT_OPENWIRE:-61616}:61616"
      - "${AMQ_PORT_CONSOLE:-8161}:8161"
    volumes:
      - amq-data:/opt/apache-activemq/data
      - ./activemq/jamii-activemq.xml:/opt/apache-activemq/conf/jamii-activemq.xml:ro
    mem_limit: ${AMQ_MEM_LIMIT:-600m}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/61616'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # -------------------------------------------------------------------
  # WSO2 Micro Integrator 4.6
  #   APIs:            http://localhost:8290/accounts/...
  #   Management API:  https://localhost:9164/management  (admin / admin)
  #                    -> Jenkins deploys new .car files through this API
  # -------------------------------------------------------------------
  mi:
    build:
      context: ./mi
      args:
        MI_BASE_IMAGE: ${MI_BASE_IMAGE:-wso2/wso2mi:4.6.0}
        ACTIVEMQ_IMAGE: ${ACTIVEMQ_IMAGE:-apache/activemq-classic:5.18.7}
    image: jamii-mi-runtime:4.6.0
    hostname: mi
    environment:
      JAVA_OPTS: ${MI_JAVA_OPTS:--Xms256m -Xmx768m}
      ACTIVEMQ_CONNECTION_USER: ${AMQ_USER:-admin}
      ACTIVEMQ_CONNECTION_PASSWORD: ${AMQ_PASSWORD:-admin}
      # read by CustomerProxy as ${configs.reqres_api_key}; set REQRES_API_KEY in .env
      reqres_api_key: ${REQRES_API_KEY:-}
      # read by LoanApplicationConsumer (queue consumer) as ${configs.*}
      loans_eligibility_url: ${LOANS_ELIGIBILITY_URL:-http://localhost:8290/loans/eligibility}
      loan_max_retries: ${LOAN_MAX_RETRIES:-3}
      loan_retry_ttl_ms: ${LOAN_RETRY_TTL_MS:-60000}
    ports:
      - "${MI_PORT_HTTP:-8290}:8290"
      - "${MI_PORT_HTTPS:-8253}:8253"
      - "${MI_PORT_MGMT:-9164}:9164"
    volumes:
      - ./config/${ENV_NAME:-dev}/mi/deployment.toml:/home/wso2carbon/wso2mi-4.6.0/conf/deployment.toml:ro
      - ../Jamii_WSO2_Project/deployment/docker/resources/log4j2.properties:/home/wso2carbon/wso2mi-4.6.0/conf/log4j2.properties:ro
      - mi-carbonapps:/home/wso2carbon/wso2mi-4.6.0/repository/deployment/server/carbonapps
      - jamii-data:/home/wso2carbon/jamii-data
    mem_limit: ${MI_MEM_LIMIT:-1200m}
    depends_on:
      sqlite-init:
        condition: service_completed_successfully
      car-build:
        condition: service_completed_successfully
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9201/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------------
  # WSO2 API Manager 4.7 (all-in-one: Publisher, Dev Portal, Gateway, Key Manager)
  #   Publisher:   https://localhost:9443/publisher   (admin / admin)
  #   Dev Portal:  https://localhost:9443/devportal
  #   Gateway:     https://localhost:8243/...
  # API backends point at MI by service name: http://mi:8290/...
  # -------------------------------------------------------------------
  apim:
    image: ${APIM_IMAGE:-wso2/wso2am:4.7.0}
    hostname: apim
    environment:
      JAVA_OPTS: ${APIM_JAVA_OPTS:--Xms512m -Xmx1536m}
    ports:
      - "${APIM_PORT_CONSOLE:-9443}:9443"
      - "${APIM_PORT_GW_HTTP:-8280}:8280"
      - "${APIM_PORT_GW_HTTPS:-8243}:8243"
    volumes:
      # built-in H2 databases (APIs, apps, subscriptions) survive container re-creation
      - apim-db:/home/wso2carbon/wso2am-4.7.0/repository/database
    mem_limit: ${APIM_MEM_LIMIT:-2500m}
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:9443/services/Version || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 15
    restart: unless-stopped

volumes:
  jamii-data:
  mi-carbonapps:
  maven-repo:
  amq-data:
  apim-db:
